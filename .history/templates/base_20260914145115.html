<!DOCTYPE html>
<html lang="ku" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>سیستەمی هەڵبژاردنەکان</title>
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="sidebar-bg" id="sidebar-wrapper">
        <div class="sidebar-heading text-center py-4 fs-4 fw-bold">سیستەمی هەڵبژاردن</div>
        <div class="list-group list-group-flush">
            <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action bg-transparent">داشبۆردی چارتەکان</a>
            {% if current_user.role != 'viewer' %}
            <a href="{{ url_for('control_panel') }}" class="list-group-item list-group-item-action bg-transparent">کۆنترۆڵ پەناڵ</a>
            <a href="#" class="list-group-item list-group-item-action bg-transparent">بەشی ڕاپۆرتەکان</a>
            <a href="#" class="list-group-item list-group-item-action bg-transparent">داغڵکردنی داتا (لق و ناوچە)</a>
            {% endif %}
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100">
        <nav class="navbar navbar-expand-lg navbar-custom border-bottom">
            <div class="container-fluid">
                <div class="d-flex align-items-center gap-3">
                    <select id="themeSelector" class="form-select form-select-sm" onchange="changeTheme(this.value)">
                        <option value="light">ڕوکاری لایت</option>
                        <option value="dark">ڕوکاری دارک</option>
                        <option value="gov">ڕوکاری فەرمی حکومی</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span>بەکارهێنەر: {{ current_user.username }} ({{ current_user.role }})</span>
                    <a href="{{ url_for('logout') }}" class="btn btn-sm btn-danger">چوونەدەرەوە</a>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-4 main-content">
            {% block content %}{% endblock %}
        </div>
        
        <!-- مافی دروستکردن -->
        <footer class="text-center py-3 mt-auto border-top footer-custom">
            <p class="mb-0 fw-bold">دروستکردنی:بەهمەن دەروێش علی</p>
        </footer>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
